name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Download and verify the assignment archive
        env:
          SHOP_ARCHIVE_SHA256: 3cf0318eb5eef0da9bee1aaa9e20a3f9df9d3a371a4457af1deefbd9a95a7b5c
        run: |
          archive="$RUNNER_TEMP/qa-shop.zip"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://qa-test.g-profile.ru/download/qa-shop.zip --output "$archive"
          printf '%s  %s\n' "$SHOP_ARCHIVE_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          printf 'SHOP_DIR=%s/qa-shop\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix "$SHOP_DIR"
      - name: Type-check tests
        run: npm run typecheck
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Chromium regression and cross-browser smoke
        run: npx playwright test
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            playwright-report*/
            test-results*/
          if-no-files-found: ignore
          retention-days: 14
